[tool.poetry]
name = "tap-gainsightpx"
version = "1.0.8"
description = "`tap-gainsightpx` is a Singer tap for GainsightPX, built with the Meltano Singer SDK."
authors = ["Josh Lloyd"]
keywords = [
    "ELT",
    "GainsightPX",
    "Meltano",
    "Singer",
    "REST",
    "API",
    "tap"
]
license = "Apache 2.0"
homepage = "https://github.com/Widen/tap-gainsightpx"
repository = "https://github.com/Widen/tap-gainsightpx"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.8,<3.13"
requests = "^2.25.1"
singer-sdk = ">=0.39.0"
sqlalchemy = ">=2.0"
greenlet = ">=3.0.0"

[tool.poetry.group.dev.dependencies]
requests-mock = "^1.11.0"
isort = "^5.13.0"
types-requests = "^2.31.0"
mypy = "^1.8.0"
pydocstyle = "^6.3.0"
black = "^24.0.0"
flake8 = {version = "^7.0.0", python = ">=3.8.1"}
tox = "^4.11.0"
pytest = "^7.4.0"

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_gainsightpx"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
# CLI declaration
tap-gainsightpx = 'tap_gainsightpx.tap:TapGainsightPX.cli'
